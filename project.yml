# Sleepy iOS — XcodeGen project definition
# 移植自 sleepy Android (~/Desktop/sleepy), GPL-3.0
name: Sleepy
options:
  bundleIdPrefix: com.lingion
  # 6s Plus 真机 = iOS 15.8.8;16.0 装不上(2026-09 真机调试定版)
  deploymentTarget:
    iOS: "15.6"
    # watchOS 10 = Series 4/SE 一代以上全覆盖 (2026-10 watch 伴侣 App 定版)
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.8"
    # 真机调试走自动签名;2026-10-26 起用付费开发者账号团队 D9UP75W466
    # (旧 Personal Team GU39QS224C 免费证书 7 天过期且不支持 App Groups)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: D9UP75W466
    CODE_SIGN_IDENTITY: "Apple Development"
    # xcodegen 不默认注入这批标准设置 — 缺 PRODUCT_NAME 产物名变空(.app/.appex 冲突)
    PRODUCT_NAME: "$(TARGET_NAME)"
    PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
    CURRENT_PROJECT_VERSION: "62"
    MARKETING_VERSION: "1.0.62"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      # 真机装机只跑 Debug;Release(archive) 仍由 build-ipa.sh 走无签名管线
      CODE_SIGN_STYLE: Automatic
    Release:
      ONLY_ACTIVE_ARCH: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"

packages:
  GRDB:
    url: https://gh.qdp.qzz.io/groue/GRDB.swift.git
    from: 6.29.3
    # 仓库 2026 改名 GRDB→GRDB.swift;tag 带 v 前缀(v6.29.3)
  SwiftSoup:
    url: https://gh.qdp.qzz.io/scinfu/SwiftSoup.git
    exactVersion: 2.7.3
    # ← Jsoup 的 Swift 移植,API 与 org.jsoup 1:1(JwQzParser/JwUrpParser 依赖)。
    # 锁 2.7.3(tools 5.7): 最新 2.13.x 要求 Swift 6 工具链,Xcode 14.3 编不过。
  ZIPFoundation:
    url: https://gh.qdp.qzz.io/weichsel/ZIPFoundation.git
    from: 0.9.20
    # 纯 Swift zip 实现,JwCaptureDump 用 iOS 标准 .zip 字节流写排查全量包。
    # Android 端走 java.util.zip,ZIPFoundation 同样输出 DEFLATE 流(标头格式兼容 unzip)。
    # 镜像源: gh.qdp 是 GitHub 协议的 1:1 镜像,tag/branch 同步无延迟。

targets:
  Sleepy:
    type: application
    platform: iOS
    sources:
      - path: Sleepy
        excludes: ["resources"]
      - path: Sleepy/resources
        # iOS 标准:lproj 目录直接作为 resources bundle 根(xcodegen 默认逐文件拷贝)
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: SwiftSoup
      - package: ZIPFoundation
      - target: SleepyWidget       # 内嵌 widget extension → PlugIns/SleepyWidget.appex
      - target: SleepyWatch        # 内嵌 watchOS 伴侣 App → Watch/SleepyWatch.app
    info:
      path: Sleepy/Info.plist
      properties:
        CFBundleDisplayName: Sleepy 课程表
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        # ★ 城市定位推荐同城学校入口 — 缺此键 → CLLocationManager 授权弹窗直接崩溃
        NSLocationWhenInUseUsageDescription: 用于根据当前位置推荐同城学校入口
        # ★ 系统日历导入(slice-cal-bg-battery) — 缺此键 → EKEventStore 授权弹窗直接崩溃
        #   pre-iOS17 走 writeOnly 读 NSCalendarsUsageDescription; iOS17+ requestFullAccessToEvents 读 FullAccess 键
        NSCalendarsUsageDescription: 用于列出可写日历并把课程表写入系统日历
        NSCalendarsFullAccessUsageDescription: 用于把课程表写入系统日历并管理已导入事件
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 全族开放方向(2026-10-26 平板/横屏适配 ← Android 版本): Android manifest
        # 无 screenOrientation 锁 + 无 resizeableActivity=false → 手机横屏(≥600dp)/
        # 平板/分屏/折叠屏展开皆 !isCompact → NavigationRail 双栏。iOS 对齐此语义:
        # 横屏/Stage Manager/分屏 实际宽度 ≥600pt → NavStyleResolver 走 rail 侧栏。
        # iPhone 不含 upsideDown(Apple HIG 惯例); iPad 四方向全开。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ★ widget 深链(widgetURL sleepy://open)+ 课程/导入深链(sleepy://course|import)
        #   依赖 scheme 注册;缺此键 → simctl openurl 报 -10814,真机 widget 点击无响应
        CFBundleURLTypes:
          - CFBundleURLName: com.lingion.sleepy
            CFBundleURLSchemes: [sleepy]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Schedule JSON
            LSHandlerRank: Owner
            LSItemContentTypes: ["public.json"]
        LSSupportsOpeningDocumentsInPlace: false
        # ★ 教务系统跳转链常混 http 中间页(校园网旧系统)。WKWebView 默认 ATS 拦 http,
        #   表现为重定向链中途断掉。Android 原版 mixedContentMode=ALWAYS_ALLOW 等价意图:
        #   只放开 WebView 内容 loads(NSAllowsArbitraryLoadsInWebContent 不影响 app 主 API)。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sleepy/Sleepy.entitlements
      # 2026-10-26 付费开发者账号(D9UP75W466)注册 App ID 后恢复:
      # 门户 Sleepy Schedule=com.lingion.sleepy / Sleepy Shared=group.com.lingion.sleepy
      # (旧 .ios 后缀 ID 被他人团队占用)。AltStore 侧载路径不受影响(重签自注入 group + ALTAppGroups)
      properties:
        com.apple.security.application-groups: [group.com.lingion.sleepy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingion.sleepy
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone+iPad(2026-10-26 平板适配; widget 族随主 app)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        # App Store 分发:手动签名 + 付费账号 Distribution 证书 + 专用 profile(2026-10-26)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sleepy AppStore"

  SleepyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SleepyWidget
      # widget 与主 app 共享实现源(data/util/theme/widget — 实体/DAO/主题/渲染);
      # extension 独立编译(不能链接主 app binary)。
      # 排除: SleepyApp 入口 / Info.plist / ui 屏幕+组件(UIApplication 等 app-only API;
      # widget 用不到屏层, 渲染逻辑已抽到 widget/ 与 util/)
      # + notification 下 BatterySettingsLauncher(UIApplication.shared,
      #   extension 里禁用 — Swift 无 per-target 编译旗标, 走文件级排除)
      # + util/NavStyleResolver(UIApplication.shared.connectedScenes 探测设备形态,
      #   extension 里禁用; 仅 SleepyApp/AppPrefs 消费, widget 无引用)
      - path: Sleepy
        excludes: ["resources", "SleepyApp.swift", "Info.plist", "ui", "app",
                   "widget/notification/BatterySettingsLauncher.swift",
                   "util/NavStyleResolver.swift"]
      - path: Sleepy/resources
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: SwiftSoup
      - package: ZIPFoundation
    info:
      path: SleepyWidget/Info.plist
      properties:
        CFBundleDisplayName: Sleepy Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SleepyWidget/SleepyWidget.entitlements
      # 同主 app:2026-10-26 付费账号后恢复 group;AltStore 重签路径自会注入
      properties:
        com.apple.security.application-groups: [group.com.lingion.sleepy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingion.sleepy.widget
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone+iPad(2026-10-26 平板适配; widget 族随主 app)
        GENERATE_INFOPLIST_FILE: "NO"
        # 共源编译条件: Sleepy/widget/** 双 target 均编, extension 进程内禁 app-only 分支
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXT
      configs:
        # 同主 app:App Store 分发手动签名 + widget 专用 profile
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sleepy Widget AppStore"

  SleepyWatch:
    type: application
    platform: watchOS
    sources:
      - path: SleepyWatch
      # 共享源直接编进本 target (同 SleepyWidget 手法)。excludes = widget 排除集
      # (app 入口/屏层/UIApplication-only 工具) + 手表不做的域:
      #   data/calendar (EventKit 系统日历写入)、data/jw (CoreLocation/SwiftSoup
      #   教务导入)、data/migration (仅 ui/ 引用, 手表镜像库不做迁移包)。
      - path: Sleepy
        excludes: ["resources", "SleepyApp.swift", "Info.plist", "ui", "app",
                   "Assets.xcassets", "LaunchScreen.storyboard",
                   "data/calendar", "data/jw", "data/migration",
                   "data/repository/ImportDraftRepository.swift",
                   # iOS WidgetKit 渲染层 (systemSmall/Medium/Large 档位与
                   # WidgetCenter 深链是 iPhone 桌面小组件专有; 手表 UI 原生重做,
                   # 只取 Foundation 级装载器)
                   "widget/TodayWidgetView.swift", "widget/TwoDayWidgetView.swift",
                   "widget/WeekGridWidgetView.swift", "widget/WeekListWidgetView.swift",
                   "widget/WeekViewWidgetView.swift", "widget/WidgetWindowCore.swift",
                   "widget/WidgetBackgroundCompat.swift", "widget/WidgetCourseCard.swift",
                   "widget/WidgetVendorActions.swift", "widget/WidgetEditViewModel.swift",
                   "widget/WidgetCompactWindow.swift", "widget/WidgetCompactHelpers.swift",
                   "widget/WidgetTextWrap.swift", "widget/WidgetSizeCore.swift",
                   "widget/WidgetResizeCore.swift", "widget/WidgetScrollStore.swift",
                   "widget/WidgetBoundaryScheduler.swift",
                   "widget/notification/BatterySettingsLauncher.swift",
                   "widget/notification/BatteryOptimizationIntents.swift",
                   "util/NavStyleResolver.swift"]
      - path: Sleepy/resources
        buildPhase: resources
    dependencies:
      - package: GRDB
    info:
      path: SleepyWatch/Info.plist
      properties:
        CFBundleDisplayName: Sleepy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lingion.sleepy
        # 独立启动语义 (通知/Complication 刷新不要求 iPhone App 在前台)
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingion.sleepy.watch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D9UP75W466
        GENERATE_INFOPLIST_FILE: "NO"
        # 上架校验硬门槛: watch App 必须有单尺寸 1024 icon (复用主 App 胶囊 mark)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 共源编译条件: 通知调度等共享文件里 watch 不适用分支按此裁剪
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WATCH_APP
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # 开发者门户待建: Sleepy Watch AppStore profile (步骤 6 前补, 未建则 Release 构建失败)
          PROVISIONING_PROFILE_SPECIFIER: "Sleepy Watch AppStore"

  SleepyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepyTests
        excludes: ["resources"]
      - path: SleepyTests/resources
        buildPhase: resources
        type: folder
    dependencies:
      - target: Sleepy
    info:
      path: SleepyTests/Info.plist
      properties:
        CFBundleIdentifier: com.lingion.sleepy.tests
        CFBundleName: SleepyTests
        CFBundlePackageType: BNDL
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingion.sleepy.tests
        GENERATE_INFOPLIST_FILE: "NO"
        # unit test 注入宿主 app 进程(xcodegen 2.38 不自动生成, 必须显式)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sleepy.app/Sleepy"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SleepyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SleepyUITests
    dependencies:
      - target: Sleepy
    entitlements:
      path: SleepyUITests/SleepyUITests.entitlements
      properties:
        # runner 需要同组权限才能读 widget 写的 widget_archive.log
        com.apple.security.application-groups: [group.com.lingion.sleepy]
    info:
      path: SleepyUITests/Info.plist
      properties:
        CFBundleIdentifier: com.lingion.sleepy.uitests
        CFBundleName: SleepyUITests
        CFBundlePackageType: BNDL
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingion.sleepy.uitests
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  Sleepy:
    build:
      targets:
        Sleepy: all
    test:
      targets:
        - SleepyTests
        - SleepyUITests
  # watchOS 伴侣 App 独立运行入口 (手表模拟器调试; CI 仍只跑 -scheme Sleepy)
  Sleepy Watch:
    build:
      targets:
        SleepyWatch: all
