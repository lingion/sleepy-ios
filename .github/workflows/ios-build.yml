name: iOS Build

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to check'
        default: master
        required: true
      task:
        description: 'Run units, one UI class/method, or build an unsigned IPA'
        type: choice
        options: [unit, ui, ipa]
        default: unit
        required: true
      ui_test:
        description: 'For ui: SleepyUITests/Class or SleepyUITests/Class/testMethod'
        required: false
      config:
        description: 'IPA build configuration'
        type: choice
        options: [Release, Debug]
        default: Release

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}-${{ inputs.task }}-${{ inputs.ui_test }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  TZ: Asia/Shanghai

jobs:
  verify:
    name: Build and tests
    if: github.event_name == 'pull_request' || inputs.task != 'ipa'
    runs-on: macos-15
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'ui' && 45 || 20 }}
    env:
      CI_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'unit' }}
      UI_TEST_SELECTOR: ${{ inputs.ui_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: Record revision and validate requested UI test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          git rev-parse HEAD | tee build/ci/revision.txt
          if [[ "$CI_TASK" == ui ]]; then
            python3 scripts/select-ui-test.py "$UI_TEST_SELECTOR" > build/ci/ui-selector.txt
          fi
          xcodebuild -version | tee build/ci/xcode.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and select simulator
        shell: bash
        run: |
          set -euo pipefail
          git config --global url.https://github.com/.insteadOf https://gh.qdp.qzz.io/
          xcodegen generate --spec project.yml
          xcrun simctl list devices available -j > build/ci/devices.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('build/ci/devices.json'))['devices']
          runtimes = sorted((r for r in devices if '.iOS-' in r),
                            key=lambda r: tuple(map(int, r.split('.iOS-')[1].split('-'))), reverse=True)
          phones = [d for r in runtimes for d in devices[r]
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          print(phones[0])
          PY
      - name: Build app, extensions and test bundles once
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -jobs 3 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/ci/build.log
      - name: Run all unit and integration tests
        if: env.CI_TASK == 'unit'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyTests -resultBundlePath build/ci/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/unit.log
          xcrun xcresulttool get test-results summary --path build/ci/unit.xcresult \
            --compact > build/ci/unit-summary.json
          python3 -c 'import json; s=json.load(open("build/ci/unit-summary.json")); assert s["totalTestCount"] > 0, "No unit tests executed"'
      - name: Run requested UI class or method
        if: env.CI_TASK == 'ui'
        shell: bash
        run: |
          set -euo pipefail
          selector=$(cat build/ci/ui-selector.txt)
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            "$selector" -resultBundlePath build/ci/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/ui.log
          xcrun xcresulttool get test-results summary --path build/ci/ui.xcresult \
            --compact > build/ci/ui-summary.json
          python3 -c 'import json; s=json.load(open("build/ci/ui-summary.json")); assert s["totalTestCount"] > 0, "No UI tests executed"'
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.CI_TASK }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci
          retention-days: 7
          if-no-files-found: warn

  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'ipa'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IPA_CONFIGURATION: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Record revision and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD | tee build/revision.txt
          git config --global url.https://github.com/.insteadOf https://gh.qdp.qzz.io/
          brew install xcodegen
      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh "$IPA_CONFIGURATION"
      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-ios-${{ inputs.config }}-${{ github.run_id }}
          path: |
            build/Sleepy-unsigned.ipa
            build/revision.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-ipa-diagnostics-${{ github.run_id }}
          path: build/ipa-build.log
          retention-days: 7
          if-no-files-found: warn
