# GitHub 托管 macOS：自动模拟器验收，手动构建无签名 IPA。
name: iOS Build

on:
  push:
    branches: ['integration/parity-v1063-all-prs']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/commit (默认 master)"
        required: false
        default: "master"
      config:
        description: "构建配置"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      tests:
        description: "跑 iOS 模拟器测试"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: ios-build-${{ inputs.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch'
    # xcodegen 新版生成的 pbxproj 是 format 77 (Xcode 16), macos-14 镜像的
    # Xcode 15.4 读不了 — 必须用 macos-15
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install xcodegen / xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh "${{ inputs.config }}"
      - name: Show IPA info
        run: ls -lh build/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-ios-${{ inputs.config }}-${{ github.run_number }}
          path: build/Sleepy-*.ipa
          if-no-files-found: error
          retention-days: 7
  acceptance:
    if: github.event_name != 'workflow_dispatch' || inputs.tests == 'yes'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [unit-drag, ui-settings, ui-workflows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project and select simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          git config --global url.https://github.com/.insteadOf https://gh.qdp.qzz.io/
          xcodebuild -version | tee build/ci/xcode.log
          xcodegen generate --spec project.yml
          cp Sleepy.xcodeproj/project.pbxproj build/ci/project.pbxproj
          xcrun simctl list devices available -j > build/ci/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/ci/devices.json'))['devices']
          runtimes = sorted((r for r in data if '.iOS-' in r),
                            key=lambda r: tuple(map(int, r.split('.iOS-')[1].split('-'))), reverse=True)
          phones = [d for r in runtimes for d in data[r]
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          print(phones[0])
          PY
      - name: Build app, extensions and test bundles
        id: build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -jobs 3 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/ci/build.log
      - name: Run unit and integration tests
        if: matrix.suite == 'unit-drag'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyTests -resultBundlePath build/ci/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/unit.log
      - name: Run native drag acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'unit-drag' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyUITests/CourseDragUITests \
            -resultBundlePath build/ci/drag.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/drag.log
      - name: Run settings and control UI acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'ui-settings' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyUITests/MineSettingsUITests \
            -only-testing:SleepyUITests/UIElementAuditUITests \
            -only-testing:SleepyUITests/WatchTimeStripSettingsUITests \
            -resultBundlePath build/ci/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/ui.log
      - name: Run remaining UI acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.suite == 'ui-workflows' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyUITests -skip-testing:SleepyUITests/CourseDragUITests \
            -skip-testing:SleepyUITests/MineSettingsUITests \
            -skip-testing:SleepyUITests/UIElementAuditUITests \
            -skip-testing:SleepyUITests/WatchTimeStripSettingsUITests \
            -resultBundlePath build/ci/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/ui.log
      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-acceptance-${{ matrix.suite }}-${{ github.sha }}
          path: build/ci
          retention-days: 7
          if-no-files-found: warn
