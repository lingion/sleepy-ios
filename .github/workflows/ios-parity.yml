name: iOS Parity Acceptance

on:
  push:
    branches: ['integration/parity-v1063-all-prs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          BIN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -1)
          chmod +x "$BIN"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$BIN" "$RUNNER_TEMP/bin/xcodegen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate project and select simulator
        shell: bash
        run: |
          set -euo pipefail
          # 云端直连官方源；项目配置保持本机已有镜像选择。
          git config --global url.https://github.com/.insteadOf https://gh.qdp.qzz.io/
          xcodegen generate --spec project.yml
          mkdir -p build/ci
          xcrun simctl list devices available -j > build/ci/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/ci/devices.json'))['devices']
          runtimes = sorted((r for r in data if '.iOS-' in r),
                            key=lambda r: tuple(map(int, r.split('.iOS-')[1].split('-'))), reverse=True)
          phones = [d for r in runtimes for d in data[r]
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          print(phones[0])
          PY
      - name: Build app, extensions and test bundles
        id: build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -jobs 3 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/ci/build.log
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyTests -resultBundlePath build/ci/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/unit.log
      - name: Run native drag acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project Sleepy.xcodeproj -scheme Sleepy \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:SleepyUITests/CourseDragUITests \
            -resultBundlePath build/ci/drag.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/drag.log
      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-parity-${{ github.sha }}
          path: build/ci
          retention-days: 7
          if-no-files-found: warn
